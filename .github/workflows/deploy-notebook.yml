name: Dynamic Databricks Notebook Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install jq & curl
      run: sudo apt-get update && sudo apt-get install -y jq curl

    - name: Export multiple notebooks (raw)
      run: |
        ORIGIN_HOST=${{ secrets.DATABRICKS_ORIGIN_HOST }}
        ORIGIN_TOKEN=${{ secrets.DATABRICKS_ORIGIN_TOKEN }}
        NOTEBOOK_BASE="/Workspace/Users/bruno_mauricio123@hotmail.com/BRUNOSMARTDATA/proceso"
        NOTEBOOKS=("1.Preparacion_Ambiente" "2.Ingest_circuits_data" "2.Ingest_Constructors" "2.Ingest_racing_data" "3.Transform" "4.Load" "5.Grants_Medallion")
        mkdir -p notebooks_to_deploy
        for nb in "${NOTEBOOKS[@]}"; do
          echo "Exportando $nb en modo raw..."
          curl -s -f -X GET \
            -H "Authorization: Bearer $ORIGIN_TOKEN" \
            "$ORIGIN_HOST/api/2.0/workspace/export?path=$NOTEBOOK_BASE/$nb&format=SOURCE&direct_download=true" \
            --output "notebooks_to_deploy/$nb.py" || { echo "❌ Error exportando $nb"; exit 1; }
        done

    - name: Deploy notebooks to Destination Workspace
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        DEST_BASE="/proyecto/ventas/notebooks"

        echo "Creando carpeta $DEST_BASE si no existe..."
        curl -s -X POST \
          -H "Authorization: Bearer $DEST_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"path\":\"$DEST_BASE\"}" \
          "$DEST_HOST/api/2.0/workspace/mkdirs"

        for file in notebooks_to_deploy/*.py; do
          name=$(basename "$file" .py)
          dest_path="$DEST_BASE/$name"
          echo "Importando $file → $dest_path"
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $DEST_TOKEN" \
            -F "path=$dest_path" \
            -F "format=SOURCE" \
            -F "language=PYTHON" \
            -F "overwrite=true" \
            -F "content=@$file" \
            "$DEST_HOST/api/2.0/workspace/import")
          echo "Response: $response"
        done

    - name: Check if workflow exists and delete if necessary
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        WORKFLOW_NAME="WF_ADB"

        echo "Verificando si existe el workflow: $WORKFLOW_NAME"

        workflows_response=$(curl -s -X GET \
          -H "Authorization: Bearer $DEST_TOKEN" \
          "$DEST_HOST/api/2.1/jobs/list?name=$WORKFLOW_NAME")

        # Puede haber más de un job con el mismo nombre: se eliminan todos
        existing_job_ids=$(echo "$workflows_response" | jq -r --arg name "$WORKFLOW_NAME" '.jobs[]? | select(.settings.name == $name) | .job_id')

        if [ -n "$existing_job_ids" ]; then
          for job_id in $existing_job_ids; do
            echo "Workflow encontrado con ID: $job_id. Eliminando..."
            delete_response=$(curl -s -X POST \
              -H "Authorization: Bearer $DEST_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"job_id\": $job_id}" \
              "$DEST_HOST/api/2.1/jobs/delete")
            echo "Delete response: $delete_response"
          done
        else
          echo "No se encontró workflow existente con nombre: $WORKFLOW_NAME"
        fi

    - name: Get existing cluster ID
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        CLUSTER_NAME="ClusterSD"

        echo "Buscando cluster existente: $CLUSTER_NAME"

        clusters_response=$(curl -s -X GET \
          -H "Authorization: Bearer $DEST_TOKEN" \
          "$DEST_HOST/api/2.0/clusters/list")

        cluster_id=$(echo "$clusters_response" | jq -r --arg name "$CLUSTER_NAME" '[.clusters[]? | select(.cluster_name == $name) | .cluster_id][0] // empty')

        if [ -n "$cluster_id" ]; then
          echo "✅ Cluster encontrado: $CLUSTER_NAME con ID: $cluster_id"
          echo "CLUSTER_ID=$cluster_id" >> $GITHUB_ENV
        else
          echo "❌ No se encontró el cluster: $CLUSTER_NAME"
          echo "Clusters disponibles:"
          echo "$clusters_response" | jq -r '.clusters[]? | .cluster_name'
          exit 1
        fi

    - name: Create Databricks Workflow WF_ADB
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        CLUSTER_ID="${{ env.CLUSTER_ID }}"

        echo "Creando workflow: WF_ADB con cluster existente ID: $CLUSTER_ID"

        # Crear el JSON del workflow usando cluster existente
        cat > workflow_config.json << EOF
        {
          "name": "WF_ADB",
          "format": "MULTI_TASK",
          "tasks": [
            {
              "task_key": "preparacion_ambiente",
              "description": "Ejecuta notebook 1.Preparacion_Ambiente con parámetros",
              "notebook_task": {
                "notebook_path": "/proyecto/ventas/notebooks/1.Preparacion_Ambiente",
                "source": "WORKSPACE",
                "base_parameters": {
                  "storageName": "adlsbrunosmartdata0810",
                  "catalogwk": "catalog_prod"
                }
              },
              "existing_cluster_id": "$CLUSTER_ID",
              "timeout_seconds": 3600,
              "max_retries": 2
            },
            {
              "task_key": "ingest_circuits_data",
              "description": "Ejecuta notebook ingest_circuits_data con parámetros",
              "notebook_task": {
                "notebook_path": "/proyecto/ventas/notebooks/2.Ingest_circuits_data",
                "source": "WORKSPACE",
                "base_parameters": {
                  "container": "raw",
                  "catalogo": "catalog_prod",
                  "esquema": "bronze",
                  "storageName": "adlsbrunosmartdata0810"
                }
              },
              "existing_cluster_id": "$CLUSTER_ID",
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [
                { "task_key": "preparacion_ambiente" }
              ]
            },
            {
              "task_key": "ingest_constructors",
              "description": "Ejecuta notebook ingest_constructors con parámetros",
              "notebook_task": {
                "notebook_path": "/proyecto/ventas/notebooks/2.Ingest_Constructors",
                "source": "WORKSPACE",
                "base_parameters": {
                  "container": "raw",
                  "catalogo": "catalog_prod",
                  "esquema": "bronze",
                  "storageName": "adlsbrunosmartdata0810"
                }
              },
              "existing_cluster_id": "$CLUSTER_ID",
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [
                { "task_key": "preparacion_ambiente" }
              ]
            },
            {
              "task_key": "ingest_racing",
              "description": "Ejecuta notebook ingest_racing con parámetros",
              "notebook_task": {
                "notebook_path": "/proyecto/ventas/notebooks/2.Ingest_racing_data",
                "source": "WORKSPACE",
                "base_parameters": {
                  "container": "raw",
                  "catalogo": "catalog_prod",
                  "esquema": "bronze",
                  "storageName": "adlsbrunosmartdata0810"
                }
              },
              "existing_cluster_id": "$CLUSTER_ID",
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [
                { "task_key": "preparacion_ambiente" }
              ]
            },
            {
              "task_key": "transform",
              "description": "Ejecuta notebook transform con parámetros",
              "notebook_task": {
                "notebook_path": "/proyecto/ventas/notebooks/3.Transform",
                "source": "WORKSPACE",
                "base_parameters": {
                  "catalogo": "catalog_prod",
                  "esquema_source": "bronze",
                  "esquema_sink": "silver"
                }
              },
              "existing_cluster_id": "$CLUSTER_ID",
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [
                { "task_key": "ingest_circuits_data" },
                { "task_key": "ingest_constructors" },
                { "task_key": "ingest_racing" }
              ]
            },
            {
              "task_key": "Load",
              "description": "Ejecuta notebook Load con parámetros",
              "notebook_task": {
                "notebook_path": "/proyecto/ventas/notebooks/4.Load",
                "source": "WORKSPACE",
                "base_parameters": {
                  "catalogo": "catalog_prod",
                  "esquema_source": "silver",
                  "esquema_sink": "golden"
                }
              },
              "existing_cluster_id": "$CLUSTER_ID",
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [
                { "task_key": "transform" }
              ]
            },
            {
              "task_key": "grants",
              "description": "Ejecuta notebook Grants con parámetros",
              "notebook_task": {
                "notebook_path": "/proyecto/ventas/notebooks/5.Grants_Medallion",
                "source": "WORKSPACE",
                "base_parameters": {
                  "catalogo": "catalog_prod"
                }
              },
              "existing_cluster_id": "$CLUSTER_ID",
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [
                { "task_key": "Load" }
              ]
            }
          ],
          "schedule": {
            "quartz_cron_expression": "0 0 8 * * ?",
            "timezone_id": "America/Lima",
            "pause_status": "PAUSED"
          },
          "email_notifications": {
            "on_failure": [],
            "on_success": [],
            "no_alert_for_skipped_runs": false
          },
          "webhook_notifications": {},
          "timeout_seconds": 7200,
          "max_concurrent_runs": 1,
          "tags": {
            "environment": "production",
            "created_by": "github_actions",
            "project": "automated_deployment",
            "cluster_used": "ClusterSD"
          }
        }
        EOF

        # Validar que el JSON generado es correcto antes de enviarlo
        jq empty workflow_config.json || { echo "❌ JSON inválido"; cat workflow_config.json; exit 1; }

        create_response=$(curl -s -X POST \
          -H "Authorization: Bearer $DEST_TOKEN" \
          -H "Content-Type: application/json" \
          -d @workflow_config.json \
          "$DEST_HOST/api/2.1/jobs/create")

        echo "Workflow creation response: $create_response"

        job_id=$(echo "$create_response" | jq -r '.job_id // empty')

        if [ -n "$job_id" ]; then
          echo "✅ Workflow 'WF_ADB' creado exitosamente con ID: $job_id"
          echo "JOB_ID=$job_id" >> $GITHUB_ENV

          workflow_details=$(curl -s -X GET \
            -H "Authorization: Bearer $DEST_TOKEN" \
            "$DEST_HOST/api/2.1/jobs/get?job_id=$job_id")

          echo "Detalles del workflow:"
          echo "$workflow_details" | jq '.settings | {name, tasks: (.tasks | map({task_key, notebook_task: .notebook_task.notebook_path}))}'
        else
          echo "❌ Error al crear el workflow"
          echo "Response completo: $create_response"
          exit 1
        fi

    - name: Validate Workflow Configuration
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        job_id="${{ env.JOB_ID }}"

        echo "🔍 Validando la configuración del workflow creado (ID: $job_id)..."

        job_details=$(curl -s -X GET \
          -H "Authorization: Bearer $DEST_TOKEN" \
          "$DEST_HOST/api/2.1/jobs/get?job_id=$job_id")

        if [ "$(echo "$job_details" | jq -r '.job_id // empty')" = "$job_id" ]; then
          echo "📋 Resumen del workflow:"
          echo "Nombre: $(echo "$job_details" | jq -r '.settings.name')"
          echo "Número de tareas: $(echo "$job_details" | jq '.settings.tasks | length')"
          echo ""
          echo "📝 Tareas configuradas:"
          echo "$job_details" | jq -r '.settings.tasks[] | "- " + .task_key + " → " + .notebook_task.notebook_path'
          echo ""
          echo "🖥️  Cluster configurado:"
          echo "Cluster ID: $(echo "$job_details" | jq -r '.settings.tasks[0].existing_cluster_id')"
          echo "Cluster Name: ClusterSD (reutilizado)"
        else
          echo "❌ No se pudo encontrar el workflow creado"
          exit 1
        fi

    - name: Clean up
      if: always()
      run: |
        rm -rf notebooks_to_deploy
        rm -f workflow_config.json

    - name: Done
      run: |
        echo "🎉 ¡Despliegue completado exitosamente!"
        echo ""
        echo "Resumen:"
        echo "Notebooks desplegados en /proyecto/ventas/notebooks:"
        echo "   1.Preparacion_Ambiente, 2.Ingest_circuits_data, 2.Ingest_Constructors,"
        echo "   2.Ingest_racing_data, 3.Transform, 4.Load, 5.Grants_Medallion"
        echo "Workflow creado: WF_ADB (ID: ${{ env.JOB_ID }})"
        echo "Flujo: preparacion_ambiente → [circuits, constructors, racing] → transform → Load → grants"
        echo "Cluster existente: ClusterSD"
        echo ""
        echo "🔗 Accede a tu workspace de Databricks para ver el workflow en la sección 'Workflows'"